services:
  workbot:
    build:
      context: .
      args:
        # Set by docker-auto-update.sh; reruns the apt upgrade layer
        SECURITY_REFRESH: ${SECURITY_REFRESH:-manual}
    container_name: workbot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      # Dedicated Codex home (auth.json + minimal config), writable for token refresh.
      - ./.codex-home:/app/.codex-home
